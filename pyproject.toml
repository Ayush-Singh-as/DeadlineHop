[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-rl"
version = "0.1.0"
description = "Deadline-aware wireless channel selection with partial feedback"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.2", "gymnasium>=1.0", "PyYAML>=6", "matplotlib>=3.8", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
report = ["reportlab>=4", "pypdf>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

